name: Auto-Sync Daily Articles from Gemini Drive Folder

on:
  schedule:
    - cron: '*/15 * * * *' # Checks every 15 minutes and syncs ONLY after Part A & Part B upload READY_FOR_SYNC payload
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  sync-drive-to-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and apply daily payload from Google Drive
        env:
          DRIVE_FOLDER_ID: '1P8l-xqjJIKcqsUR1IF8fiZvrvRl1v5Md'
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const https = require('https');

          function fetchText(url) {
            return new Promise((resolve, reject) => {
              https.get(url, { headers: { 'User-Agent': 'Mozilla/5.0' } }, (res) => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  return resolve(fetchText(res.headers.location));
                }
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(data));
              }).on('error', reject);
            });
          }

          function downloadBinary(url, dest) {
            return new Promise((resolve, reject) => {
              https.get(url, { headers: { 'User-Agent': 'Mozilla/5.0' } }, (res) => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  return resolve(downloadBinary(res.headers.location, dest));
                }
                const file = fs.createWriteStream(dest);
                res.pipe(file);
                file.on('finish', () => file.close(resolve));
              }).on('error', reject);
            });
          }

          (async () => {
            const folderUrl = `https://drive.google.com/embeddedfolderview?id=${process.env.DRIVE_FOLDER_ID}#list`;
            const folderHtml = await fetchText(folderUrl);

            const entryRegex = /id="entry-([A-Za-z0-9_-]+)"[\s\S]*?<div class="flip-entry-title">([^<]+)<\/div>/g;
            const files = {};
            let match;
            while ((match = entryRegex.exec(folderHtml)) !== null) {
              files[match[2].trim()] = match[1].trim();
            }

            const payloadId = files['daily_publish_payload.json'];
            if (!payloadId) {
              console.log('No daily_publish_payload.json found in Drive folder. Exiting cleanly.');
              process.exit(0);
            }

            const rawJson = await fetchText(`https://drive.google.com/uc?export=download&id=${payloadId}`);
            const payload = JSON.parse(rawJson);

            if (payload.status && payload.status !== 'READY_FOR_SYNC') {
              console.log(`Payload status is ${payload.status} (waiting for Part A & Part B completion). Exiting.`);
              process.exit(0);
            }

            let articlesFile = fs.readFileSync('src/data/articles.ts', 'utf8');
            let sitemapFile = fs.readFileSync('public/sitemap.xml', 'utf8');
            fs.mkdirSync('public/images/articles', { recursive: true });

            let updatedCount = 0;

            for (const art of (payload.articles || [])) {
              // 1. Download cover thumbnail
              const imgId = art.driveImageFileId || files[art.imageFilename];
              const imgDest = path.join('public/images/articles', art.imageFilename);
              if (imgId && !fs.existsSync(imgDest)) {
                await downloadBinary(`https://drive.google.com/uc?export=download&id=${imgId}`, imgDest);
                console.log(`Downloaded cover image: ${art.imageFilename}`);
              }

              // 2. Download in-article inline images (if present)
              for (const inlineImg of (art.inlineImages || [])) {
                const inlineId = inlineImg.driveFileId || files[inlineImg.filename];
                const inlineDest = path.join('public/images/articles', inlineImg.filename);
                if (inlineId && !fs.existsSync(inlineDest)) {
                  await downloadBinary(`https://drive.google.com/uc?export=download&id=${inlineId}`, inlineDest);
                  console.log(`Downloaded inline image: ${inlineImg.filename}`);
                }
              }

              // 3. Build TypeScript article entry
              const entryBlock = `  {\n` +
                `    id: ${JSON.stringify(art.id)},\n` +
                `    slug: ${JSON.stringify(art.slug)},\n` +
                `    title: ${JSON.stringify(art.title)},\n` +
                `    metaTitle: ${JSON.stringify(art.metaTitle)},\n` +
                `    excerpt: ${JSON.stringify(art.excerpt)},\n` +
                `    metaDescription: ${JSON.stringify(art.metaDescription)},\n` +
                `    category: ${JSON.stringify(art.category)},\n` +
                `    author: authors[${art.authorIndex || 0}],\n` +
                `    coverImage: ${JSON.stringify(art.coverImage)},\n` +
                `    publishedAt: ${JSON.stringify(art.publishedAt)},\n` +
                `    readTime: ${art.readTime || 6},\n` +
                `    featured: ${Boolean(art.featured)},\n` +
                `    editorsPick: ${Boolean(art.editorsPick)},\n` +
                `    tags: ${JSON.stringify(art.tags, null, 6).replace(/\n\]/g, '\n    ]')},\n` +
                `    content: \`${art.content.replace(/`/g, '\\`').replace(/\$\{/g, '\\${')}\`\n` +
                `  },\n`;

              const existingPattern = new RegExp(
                `  \\{\\s*id:\\s*${JSON.stringify(art.id)},\\s*slug:\\s*${JSON.stringify(art.slug)},[\\s\\S]*?content:\\s*\`[\\s\\S]*?\`\\s*\\},\\n?`
              );

              if (existingPattern.test(articlesFile)) {
                const replaced = articlesFile.replace(existingPattern, entryBlock);
                if (replaced !== articlesFile) {
                  articlesFile = replaced;
                  updatedCount++;
                  console.log(`Updated existing article: ${art.slug}`);
                }
              } else {
                const marker = 'export const articles: Article[] = [';
                articlesFile = articlesFile.replace(marker, marker + '\n' + entryBlock);
                updatedCount++;
                console.log(`Added new article: ${art.slug}`);
              }

              // 4. Add sitemap entry if missing
              const locUrl = `https://www.curiosityfields.com/article/${art.slug}`;
              if (!sitemapFile.includes(locUrl)) {
                const urlEntry = `  <url>\n    <loc>${locUrl}</loc>\n    <lastmod>${art.publishedAt}</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.8</priority>\n  </url>\n</urlset>`;
                sitemapFile = sitemapFile.replace('</urlset>', urlEntry);
              }
            }

            fs.writeFileSync('src/data/articles.ts', articlesFile, 'utf8');
            fs.writeFileSync('public/sitemap.xml', sitemapFile, 'utf8');
            console.log(`Sync check complete. Articles added/updated: ${updatedCount}`);
          })();
          EOF

      - name: Commit and Push if changes exist
        run: |
          git config user.name "curiosity-engine-bot"
          git config user.email "bot@curiosityfields.com"
          git add src/data/articles.ts public/sitemap.xml public/images/articles/
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "chore(content): auto-sync daily articles, inline images, and sitemap from Drive"
            git push origin main
          fi
