
name: Auto-Sync Daily Articles from Gemini Drive Folder

on:
  # Immediate trigger after Gemini Part B completes
  repository_dispatch:
    types: [articles_ready]

  # Manual fallback
  workflow_dispatch:
    inputs:
      payload_file_id:
        description: 'Google Drive file ID of the exact payload to publish'
        required: false
        type: string

  # Backup polling every 5 minutes
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: curiosityfields-article-sync
  cancel-in-progress: false

jobs:
  sync-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Discover Drive payloads and images
        env:
          DRIVE_FOLDER_ID: "1P8l-xqjJIKcqsUR1IF8fiZvrvRl1v5Md"
          PAYLOAD_FILE_ID: ${{ github.event.client_payload.payload_file_id || inputs.payload_file_id || '' }}
          VERIFIED_CUMULATIVE_PAYLOAD_ID: "1HjCsPKrISZiAbJR9BLDQhaUq_9E57LV1"
        run: |
          mkdir -p /tmp/gemini_sync

          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');

          const dir = '/tmp/gemini_sync';
          const folderId = process.env.DRIVE_FOLDER_ID;
          const directId = process.env.PAYLOAD_FILE_ID;
          const cumulativeId = process.env.VERIFIED_CUMULATIVE_PAYLOAD_ID;

          function curl(url, destination) {
            try {
              execFileSync('curl', [
                '-sSL', '--fail',
                '--retry', '3',
                '--retry-delay', '2',
                '-o', destination,
                url
              ], { stdio: 'pipe' });

              return fs.existsSync(destination) &&
                fs.statSync(destination).size > 0;
            } catch {
              return false;
            }
          }

          function downloadDrive(id, destination) {
            const urls = [
              `https://drive.google.com/uc?export=download&id=${id}`,
              `https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t`
            ];

            for (const url of urls) {
              if (!curl(url, destination)) continue;

              const head = fs.readFileSync(destination)
                .subarray(0, 500).toString('utf8').toLowerCase();

              if (
                !head.includes('<!doctype html') &&
                !head.includes('<html')
              ) {
                return true;
              }
            }

            return false;
          }

          // Always discover image IDs, including event-triggered runs.
          const folderPath = path.join(dir, 'folder_list.html');

          const folderUrl =
            `https://drive.google.com/embeddedfolderview?id=${folderId}#list`;

          if (!curl(folderUrl, folderPath)) {
            throw new Error('Could not access Google Drive folder listing.');
          }

          const html = fs.readFileSync(folderPath, 'utf8');

          const regex =
            /id="entry-([A-Za-z0-9_-]+)"[\s\S]*?<div class="flip-entry-title">([^<]+)<\/div>/g;

          const payloads = [];
          const imageMap = {};

          let match;

          while ((match = regex.exec(html)) !== null) {
            const id = match[1];
            const name = match[2].trim();

            if (/\.(jpg|jpeg|png|webp)$/i.test(name)) {
              imageMap[name] = id;
            }

            if (
              name.startsWith('daily_publish_payload') &&
              name.endsWith('.json')
            ) {
              payloads.push({ id, title: name });
            }
          }

          // Direct event: process only the payload supplied by Part B.
          if (directId) {
            payloads.length = 0;
            payloads.push({
              id: directId,
              title: 'event-payload.json'
            });
          } else {
            // Fallback: process discovered payloads and verified cumulative payload.
            if (
              cumulativeId &&
              !payloads.some(p => p.id === cumulativeId)
            ) {
              payloads.push({
                id: cumulativeId,
                title: 'verified-cumulative.json'
              });
            }
          }

          fs.writeFileSync(
            path.join(dir, 'image-map.json'),
            JSON.stringify(imageMap)
          );

          console.log(
            `Discovered ${Object.keys(imageMap).length} images and ${payloads.length} payloads.`
          );

          const readyPayloads = [];

          for (const item of payloads) {
            const destination = path.join(dir, `${item.id}.json`);

            if (!downloadDrive(item.id, destination)) {
              throw new Error(`Payload download failed: ${item.title}`);
            }

            let payload;

            try {
              payload = JSON.parse(fs.readFileSync(destination, 'utf8'));
            } catch {
              throw new Error(`Invalid JSON: ${item.title}`);
            }

            const structurallyReady =
              payload.status == null &&
              Boolean(payload.publishDate) &&
              Array.isArray(payload.articles) &&
              payload.articles.length > 0 &&
              payload.articles.every(a => a && a.slug && a.title && a.content);

            if (payload.status !== 'READY_FOR_SYNC' && !structurallyReady) {
              console.log(`Not ready or invalid payload: ${item.title}`);
              continue;
            }

            if (
              !Array.isArray(payload.articles) ||
              payload.articles.length === 0
            ) {
              throw new Error(`Ready payload has no articles: ${item.title}`);
            }

            readyPayloads.push({
              path: destination,
              title: item.title
            });
          }

          fs.writeFileSync(
            path.join(dir, 'ready-payloads.json'),
            JSON.stringify(readyPayloads)
          );

          console.log(`Ready payloads: ${readyPayloads.length}`);
          EOF

      - name: Sync articles, cover images, inline images and sitemap
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');

          const dir = '/tmp/gemini_sync';
          const imageDir = 'public/images/articles';

          const manifest = path.join(dir, 'ready-payloads.json');

          if (!fs.existsSync(manifest)) {
            throw new Error('Ready payload manifest is missing.');
          }

          const payloadFiles = JSON.parse(
            fs.readFileSync(manifest, 'utf8')
          );

          if (payloadFiles.length === 0) {
            console.log('No READY_FOR_SYNC payloads. Nothing to sync.');
            process.exit(0);
          }

          const imageMap = JSON.parse(
            fs.readFileSync(path.join(dir, 'image-map.json'), 'utf8')
          );

          fs.mkdirSync(imageDir, { recursive: true });

          function safeName(filename) {
            if (!filename || path.basename(filename) !== filename) {
              throw new Error(`Invalid image filename: ${filename}`);
            }
            return filename;
          }

          function downloadImage(id, destination) {
            const urls = [
              `https://drive.google.com/uc?export=download&id=${id}`,
              `https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t`
            ];

            for (const url of urls) {
              try {
                execFileSync('curl', [
                  '-sSL', '--fail', '--retry', '3',
                  '-o', destination, url
                ], { stdio: 'pipe' });

                if (
                  fs.existsSync(destination) &&
                  fs.statSync(destination).size > 0
                ) {
                  const head = fs.readFileSync(destination)
                    .subarray(0, 500).toString('utf8').toLowerCase();

                  if (
                    !head.includes('<html') &&
                    !head.includes('<!doctype html')
                  ) {
                    return;
                  }
                }
              } catch {
                // Try alternate download URL.
              }
            }

            throw new Error(`Image download failed: ${id}`);
          }

          function ensureImage(filename, driveId) {
            safeName(filename);

            const destination = path.join(imageDir, filename);

            if (
              fs.existsSync(destination) &&
              fs.statSync(destination).size > 0
            ) {
              return;
            }

            const id = driveId || imageMap[filename];

            if (!id) {
              throw new Error(`Image not found in Drive: ${filename}`);
            }

            downloadImage(id, destination);

            if (!fs.existsSync(destination) ||
                fs.statSync(destination).size === 0) {
              throw new Error(`Image validation failed: ${filename}`);
            }

            console.log(`Image ready: ${filename}`);
          }

          const CATEGORY_MAP = {
            'science': 'science',
            'history': 'history',
            'technology': 'technology',
            'future innovation': 'future-innovation',
            'future-innovation': 'future-innovation',
            'astronomy': 'astronomy',
            'astronomy & space': 'astronomy',
            'astronomy-space': 'astronomy',
            'artificial intelligence': 'artificial-intelligence',
            'artificial-intelligence': 'artificial-intelligence',
            'psychology & mind': 'psychology-mind',
            'psychology-mind': 'psychology-mind'
          };

          function escapeXml(value) {
            return String(value)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&apos;');
          }

          let articlesTs = fs.readFileSync(
            'src/data/articles.ts', 'utf8'
          );

          let sitemapXml = fs.readFileSync(
            'public/sitemap.xml', 'utf8'
          );

          if (!sitemapXml.includes('</urlset>')) {
            throw new Error('Invalid sitemap structure.');
          }

          let added = 0;
          let modified = false;
          const seen = new Set();

          for (const item of payloadFiles) {
            const payload = JSON.parse(
              fs.readFileSync(item.path, 'utf8')
            );

            if (payload.status !== 'READY_FOR_SYNC') {
              throw new Error(`Payload readiness changed: ${item.title}`);
            }

            for (const art of payload.articles) {
              if (!art || !art.slug || !art.title || !art.content) {
                throw new Error('Incomplete article detected.');
              }

              const slug = String(art.slug).trim();

              if (seen.has(slug)) continue;
              seen.add(slug);

              const coverFilename = safeName(
                art.imageFilename ||
                art.imageFileName ||
                art.driveImageFileName ||
                (art.image ? path.basename(art.image) : null) ||
                `${slug}.jpg`
              );

              ensureImage(
                coverFilename,
                art.driveImageFileId || null
              );

              const coverPath =
                art.coverImage ||
                art.image ||
                `/images/articles/${coverFilename}`;

              for (const img of (art.inlineImages || [])) {
                const filename = img.filename || img.fileName || img.driveFileName || (img.path ? path.basename(img.path) : null);

                if (filename) {
                  ensureImage(
                    filename,
                    img.driveFileId || null
                  );
                }
              }

              const exists =
                articlesTs.includes(`slug: "${slug}"`) ||
                articlesTs.includes(`slug: '${slug}'`);

              if (!exists) {
                const rawCategory = String(
                  art.categorySlug || art.category || 'science'
                ).toLowerCase().trim();

                const category = CATEGORY_MAP[rawCategory];

                if (!category) {
                  throw new Error(`Unknown category: ${rawCategory}`);
                }

                const publishedAt =
                  art.publishedAt || art.date || payload.publishDate;

                if (!publishedAt) {
                  throw new Error(`Missing publication date: ${slug}`);
                }

                const readTime =
                  typeof art.readTime === 'number'
                    ? art.readTime
                    : parseInt(String(art.readTime), 10) || 6;

                const authorIndex =
                  typeof art.authorIndex === 'number'
                    ? art.authorIndex
                    : 0;

                const safeContent = String(art.content)
                  .split('\\').join('\\\\')
                  .split('`').join('\\`')
                  .split('${').join('\\${');

                const entry = [
                  '  {',
                  `    id: ${JSON.stringify(art.id || slug)},`,
                  `    slug: ${JSON.stringify(slug)},`,
                  `    title: ${JSON.stringify(art.title)},`,
                  `    metaTitle: ${JSON.stringify(art.metaTitle || art.title)},`,
                  `    excerpt: ${JSON.stringify(art.excerpt || art.metaDescription || '')},`,
                  `    metaDescription: ${JSON.stringify(art.metaDescription || art.excerpt || '')},`,
                  `    category: ${JSON.stringify(category)},`,
                  `    author: authors[${authorIndex}],`,
                  `    coverImage: ${JSON.stringify(coverPath)},`,
                  `    publishedAt: ${JSON.stringify(publishedAt)},`,
                  `    readTime: ${readTime},`,
                  `    featured: ${Boolean(art.featured)},`,
                  `    editorsPick: ${Boolean(art.editorsPick)},`,
                  `    tags: ${JSON.stringify(Array.isArray(art.tags) ? art.tags : [])},`,
                  `    content: \`${safeContent}\``,
                  '  },'
                ].join('\n');

                const marker = articlesTs.match(
                  /export\s+const\s+articles(?:\s*:\s*[^=]+)?\s*=\s*\[/
                );

                if (!marker) {
                  throw new Error('Articles array not found.');
                }

                const pos = marker.index + marker[0].length;

                articlesTs =
                  articlesTs.slice(0, pos) +
                  '\n' + entry +
                  articlesTs.slice(pos);

                added++;
                modified = true;

                console.log(`Added article: ${slug}`);
              } else {
                console.log(`Article already exists: ${slug}`);
              }

              // Ensure sitemap entry exists even for existing articles.
              const loc =
                `https://www.curiosityfields.com/article/${slug}`;

              if (!sitemapXml.includes(`<loc>${loc}</loc>`)) {
                const publishedAt =
                  art.publishedAt || art.date || payload.publishDate;

                if (!publishedAt) {
                  throw new Error(`Missing sitemap date: ${slug}`);
                }

                const urlEntry = [
                  '  <url>',
                  `    <loc>${escapeXml(loc)}</loc>`,
                  `    <lastmod>${escapeXml(publishedAt)}</lastmod>`,
                  '    <changefreq>monthly</changefreq>',
                  '    <priority>0.8</priority>',
                  '  </url>'
                ].join('\n');

                sitemapXml = sitemapXml.replace(
                  '</urlset>',
                  urlEntry + '\n</urlset>'
                );

                modified = true;
                console.log(`Added sitemap URL: ${slug}`);
              }
            }
          }

          if (modified) {
            fs.writeFileSync('src/data/articles.ts', articlesTs);
            fs.writeFileSync('public/sitemap.xml', sitemapXml);
          }

          console.log(`New articles added: ${added}`);
          EOF

      - name: Commit and push changes to main
        run: |
          git diff --check

          git config user.name "CuriosityFields Auto-Publisher"
          git config user.email "bot@curiosityfields.com"

          git add public/images/articles/ \
            src/data/articles.ts \
            public/sitemap.xml

          if git diff --cached --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-sync CuriosityFields articles, images and sitemap"

            git pull --rebase origin main

            git push origin main

            echo "Successfully committed and pushed to main."
          fi
