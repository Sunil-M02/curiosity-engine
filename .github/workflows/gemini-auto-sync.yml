name: Auto-Sync Daily Articles from Gemini Drive Folder

on:
  schedule:
    # Polls every 5 minutes so new READY_FOR_SYNC payloads commit immediately after Part B finishes
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup gdown
        run: |
          pip install -U gdown

      - name: Download daily payloads and images from shared Google Drive folder
        env:
          DRIVE_FOLDER_ID: "1P8l-xqjJIKcqsUR1IF8fiZvrvRl1v5Md"
          OCT29_V2_PAYLOAD_ID: "1esU_7AEnJ69eRynvdsFLpAXoqQjqfVMu"
          OCT30_PAYLOAD_ID: "1iv3-9qe5Mcd3LVT2V7hltvixoISqColK"
        run: |
          mkdir -p /tmp/gemini_sync
          gdown --folder "https://drive.google.com/drive/folders/${DRIVE_FOLDER_ID}" -O /tmp/gemini_sync --remaining-ok || true
          # Ensure both Oct 29 v2 and Oct 30 payloads are present even if folder download hit file limits
          gdown "https://drive.google.com/uc?id=${OCT29_V2_PAYLOAD_ID}" -O /tmp/gemini_sync/daily_publish_payload_2026-10-29_v2.json || true
          gdown "https://drive.google.com/uc?id=${OCT30_PAYLOAD_ID}" -O /tmp/gemini_sync/daily_publish_payload_2026-10-30.json || true

      - name: Inject new and updated articles, cover thumbnails, inline images, and sitemap entries
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          function getAllFiles(dirPath, arrayOfFiles = []) {
            if (!fs.existsSync(dirPath)) return arrayOfFiles;
            const entries = fs.readdirSync(dirPath, { withFileTypes: true });
            for (const entry of entries) {
              const fullPath = path.join(dirPath, entry.name);
              if (entry.isDirectory()) {
                getAllFiles(fullPath, arrayOfFiles);
              } else {
                arrayOfFiles.push(fullPath);
              }
            }
            return arrayOfFiles;
          }

          const syncDir = '/tmp/gemini_sync';
          const allFiles = getAllFiles(syncDir);
          const payloadFiles = allFiles
            .filter(f => path.basename(f).startsWith('daily_publish_payload') && f.endsWith('.json'))
            .sort();

          if (payloadFiles.length === 0) {
            console.log('No daily_publish_payload*.json found in sync folder.');
            process.exit(0);
          }

          fs.mkdirSync('public/images/articles', { recursive: true });
          for (const filePath of allFiles) {
            const base = path.basename(filePath);
            if (base.endsWith('.jpg') || base.endsWith('.png')) {
              fs.copyFileSync(filePath, path.join('public/images/articles', base));
              console.log(`Copied image from folder download: ${base}`);
            }
          }

          let articlesTs = fs.readFileSync('src/data/articles.ts', 'utf8');
          let sitemapXml = fs.readFileSync('public/sitemap.xml', 'utf8');
          let changedCount = 0;

          for (const pFile of payloadFiles) {
            let payload;
            try {
              payload = JSON.parse(fs.readFileSync(pFile, 'utf8'));
            } catch (e) {
              console.warn(`Skipping unparseable JSON file: ${pFile}`);
              continue;
            }

            if (payload.status && payload.status !== 'READY_FOR_SYNC') {
              console.log(`Skipping payload ${pFile} with status: ${payload.status}`);
              continue;
            }

            const articles = Array.isArray(payload.articles) ? payload.articles : [];

            for (const art of articles) {
              // 1. Ensure cover thumbnail exists or download directly by driveImageFileId
              if (art.imageFilename && art.driveImageFileId) {
                const targetImg = path.join('public/images/articles', art.imageFilename);
                if (!fs.existsSync(targetImg) || fs.statSync(targetImg).size === 0) {
                  try {
                    console.log(`Downloading cover image by ID for ${art.imageFilename}...`);
                    execSync(`gdown "https://drive.google.com/uc?id=${art.driveImageFileId}" -O "${targetImg}"`, { stdio: 'inherit' });
                    changedCount++;
                  } catch (e) {
                    console.warn(`Fallback cover image download failed for ${art.imageFilename}:`, e.message);
                  }
                }
              }

              // 2. Ensure all in-article inlineImages exist or download directly by driveFileId
              for (const inlineImg of (art.inlineImages || [])) {
                if (inlineImg.filename && inlineImg.driveFileId) {
                  const targetInline = path.join('public/images/articles', inlineImg.filename);
                  if (!fs.existsSync(targetInline) || fs.statSync(targetInline).size === 0) {
                    try {
                      console.log(`Downloading inline image by ID for ${inlineImg.filename}...`);
                      execSync(`gdown "https://drive.google.com/uc?id=${inlineImg.driveFileId}" -O "${targetInline}"`, { stdio: 'inherit' });
                      changedCount++;
                    } catch (e) {
                      console.warn(`Fallback inline image download failed for ${inlineImg.filename}:`, e.message);
                    }
                  }
                }
              }

              // 3. Build TypeScript article entry
              const safeContent = String(art.content || '').split('`').join('\\`').split('${').join('\\${');
              const entryLines = [
                '  {',
                `    id: ${JSON.stringify(art.id)},`,
                `    slug: ${JSON.stringify(art.slug)},`,
                `    title: ${JSON.stringify(art.title)},`,
                `    metaTitle: ${JSON.stringify(art.metaTitle)},`,
                `    excerpt: ${JSON.stringify(art.excerpt)},`,
                `    metaDescription: ${JSON.stringify(art.metaDescription)},`,
                `    category: ${JSON.stringify(art.category)},`,
                `    author: authors[${art.authorIndex || 0}],`,
                `    coverImage: ${JSON.stringify(art.coverImage)},`,
                `    publishedAt: ${JSON.stringify(art.publishedAt)},`,
                `    readTime: ${art.readTime || 6},`,
                `    featured: ${Boolean(art.featured)},`,
                `    editorsPick: ${Boolean(art.editorsPick)},`,
                `    tags: ${JSON.stringify(art.tags)},`,
                `    content: \`${safeContent}\``,
                '  },'
              ].join('\n');

              const existingPattern = new RegExp(
                `  \\{\\s*id:\\s*${JSON.stringify(art.id)},\\s*slug:\\s*${JSON.stringify(art.slug)},[\\s\\S]*?content:\\s*\`[\\s\\S]*?\`\\s*\\},`
              );

              if (existingPattern.test(articlesTs)) {
                const updatedTs = articlesTs.replace(existingPattern, entryLines);
                if (updatedTs !== articlesTs) {
                  articlesTs = updatedTs;
                  changedCount++;
                  console.log(`Updated existing article in src/data/articles.ts: ${art.slug}`);
                } else {
                  console.log(`Article already up-to-date: ${art.slug}`);
                }
              } else {
                const match = articlesTs.match(/export\s+const\s+articles(?:\s*:\s*[^=]+)?\s*=\s*\[/);
                if (match) {
                  const insertPos = match.index + match[0].length;
                  articlesTs = articlesTs.slice(0, insertPos) + '\n' + entryLines + articlesTs.slice(insertPos);
                  changedCount++;
                  console.log(`Injected new article into src/data/articles.ts: ${art.slug}`);
                } else {
                  console.error('Could not find articles array declaration in src/data/articles.ts');
                  process.exit(1);
                }
              }

              // 4. Add URL to public/sitemap.xml if missing
              const locUrl = `https://www.curiosityfields.com/article/${art.slug}`;
              if (!sitemapXml.includes(locUrl)) {
                const urlBlock = [
                  '  <url>',
                  `    <loc>${locUrl}</loc>`,
                  `    <lastmod>${art.publishedAt}</lastmod>`,
                  '    <changefreq>monthly</changefreq>',
                  '    <priority>0.8</priority>',
                  '  </url>',
                  '</urlset>'
                ].join('\n');
                sitemapXml = sitemapXml.replace('</urlset>', urlBlock);
                changedCount++;
                console.log(`Added URL to public/sitemap.xml: ${locUrl}`);
              }
            }
          }

          if (changedCount > 0) {
            fs.writeFileSync('src/data/articles.ts', articlesTs, 'utf8');
            fs.writeFileSync('public/sitemap.xml', sitemapXml, 'utf8');
            console.log(`Successfully updated repository with ${changedCount} change(s).`);
          } else {
            console.log('All articles, images, and sitemap entries are already up to date.');
          }
          EOF

      - name: Commit and push changes to main (for Lovable sync)
        run: |
          git config user.name "CuriosityFields Auto-Publisher"
          git config user.email "sunilfun009@gmail.com"
          git add public/images/articles/ src/data/articles.ts public/sitemap.xml
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-sync daily CuriosityFields articles, inline images, and sitemap"
            git pull --rebase origin main
            git push origin main
          fi
